name: marc-server
channels:
  - conda-forge
dependencies:
  - python=3.8.16
  - pip=24.3.1
  - pip:
      # Formal execution server: PyTorch CUDA 11.1 wheels installed through pip.
      - -f https://download.pytorch.org/whl/torch_stable.html
      - torch==1.8.1+cu111
      - torchvision==0.9.1+cu111
      - torchaudio==0.8.1
      - numpy==1.24.4
      - pandas==2.0.2
      - scikit-learn==1.2.2
      # Release-package CLI and synthetic-test dependencies.
      - PyYAML==6.0.1
      - pytest==7.4.0
      - -e .
