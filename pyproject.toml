[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "marc-reproducibility"
version = "0.1.0"
description = "Anonymized MARC reproducibility package"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
  "numpy>=1.20",
  "pandas>=1.3",
  "PyYAML>=6.0",
  "scikit-learn>=1.0",
  "torch>=1.8",
]

[project.optional-dependencies]
test = [
  "pytest==7.4.0",
]

[tool.setuptools]
packages = ["marc", "marc.data", "marc.models", "marc.preprocessing", "marc.training", "scripts", "analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
